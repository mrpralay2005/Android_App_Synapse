name = "synapse-backend-local"
main = "server.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# This local-only configuration deliberately omits the Cloudflare AI binding.
# Privacy, authentication, posts, stories, and settings all run locally; only
# AI routes require the remote Cloudflare AI proxy used by the regular config.
[vars]
AI_BACKEND_URL = "https://your-ai-backend.onrender.com"
GITHUB_REPOSITORY = "mrpralay2005/Android_App_Synapse"

[env.local]
name = "synapse-backend-local"
