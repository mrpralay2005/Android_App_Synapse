name = "synapse-backend"
main = "server.js"
compatibility_date = "2025-01-01"
compatibility_flags = [ "nodejs_compat" ]

# Cloudflare Workers AI — Priya's brain.
[ai]
binding = "AI"

# Keep Neon DB warm — runs every 4 minutes to prevent auto-suspend.
[triggers]
crons = ["*/4 * * * *"]

[vars]
AI_BACKEND_URL = "https://your-ai-backend.onrender.com"
GITHUB_REPOSITORY = "mrpralay2005/Android_App_Synapse"

# Staging environment
[env.staging]
name = "synapse-backend-staging"

[env.staging.ai]
binding = "AI"

[env.staging.vars]
AI_BACKEND_URL = "https://your-ai-backend.onrender.com"
PREVIEW_MODE = "true"
GITHUB_REPOSITORY = "mrpralay2005/Android_App_Synapse"

[observability]
enabled = true
