name = "synapse-backend"
main = "server.js"
compatibility_date = "2025-01-01"
compatibility_flags = [ "nodejs_compat" ]

# Cloudflare Workers AI — Priya's brain.
# NOTE: The [ai] binding requires a Cloudflare account with AI enabled.
# Local dev (wrangler dev) will use the built-in dev mock in aiRoutes.js instead.
# Production and staging use real Cloudflare GPU inference.
[ai]
binding = "AI"

[vars]
AI_BACKEND_URL = "https://your-ai-backend.onrender.com"

# Staging environment — also needs AI binding enabled in Cloudflare dashboard
[env.staging]
name = "synapse-backend-staging"

[env.staging.ai]
binding = "AI"

[env.staging.vars]
AI_BACKEND_URL = "https://your-ai-backend.onrender.com"
PREVIEW_MODE = "true"

[observability]
enabled = true
