name = "synapse-backend"
main = "server.js"
compatibility_date = "2025-01-01"
compatibility_flags = [ "nodejs_compat" ]

# [ai] binding intentionally omitted at top level — local dev uses the mock
# in aiRoutes.js (generateDevReply). The AI binding is configured only in the
# Cloudflare dashboard for deployed Workers (production + staging).

[vars]
AI_BACKEND_URL = "https://your-ai-backend.onrender.com"

# Staging environment
[env.staging]
name = "synapse-backend-staging"

[env.staging.ai]
binding = "AI"

[env.staging.vars]
AI_BACKEND_URL = "https://your-ai-backend.onrender.com"
PREVIEW_MODE = "true"

[observability]
enabled = true
