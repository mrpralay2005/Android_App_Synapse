name = "synapse-backend"
main = "server.js"
compatibility_date = "2025-01-01"
compatibility_flags = [ "nodejs_compat" ]

# Cloudflare Workers AI — Priya's brain.
[ai]
binding = "AI"

# Cloudflare KV — Ultra-fast cache (Instagram's Redis alternative)
# FREE: 100k reads/day, 1k writes/day
[[kv_namespaces]]
binding = "CACHE"
id = "1fc7afe380d0411687cd82413c03b54b"

# Keep Neon DB warm — runs every 4 minutes to prevent auto-suspend.
[triggers]
crons = ["*/4 * * * *"]

[vars]
AI_BACKEND_URL = "https://your-ai-backend.onrender.com"
GITHUB_REPOSITORY = "mrpralay2005/Android_App_Synapse"

[observability]
enabled = true

