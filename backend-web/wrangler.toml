name = "synapse-backend"
main = "server.js"
compatibility_date = "2025-01-01"
compatibility_flags = [ "nodejs_compat" ]

# Cloudflare Workers AI — Priya's brain.
# This binding is declared here so wrangler deploy never wipes it from Cloudflare.
# Local dev: wrangler automatically uses a remote AI proxy for this binding.
[ai]
binding = "AI"

[vars]
AI_BACKEND_URL = "https://your-ai-backend.onrender.com"
GITHUB_REPOSITORY = "mrpralay2005/Android_App_Synapse"

# Staging environment
[env.staging]
name = "synapse-backend-staging"

[env.staging.ai]
binding = "AI"

[env.staging.vars]
AI_BACKEND_URL = "https://your-ai-backend.onrender.com"
PREVIEW_MODE = "true"
GITHUB_REPOSITORY = "mrpralay2005/Android_App_Synapse"

[observability]
enabled = true
