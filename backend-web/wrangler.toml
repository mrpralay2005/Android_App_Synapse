name = "synapse-backend"
main = "server.js"
compatibility_date = "2025-01-01"
compatibility_flags = [ "nodejs_compat" ]

# Cloudflare Workers AI — Priya's brain.
# Runs on Cloudflare's GPU infrastructure — zero load on user devices.
# IMPORTANT: After deploying, go to Cloudflare dashboard and enable the AI binding:
# Workers & Pages → synapse-backend → Settings → Bindings → Add → Workers AI → name = "AI"
# Do the same for synapse-backend-staging.
[ai]
binding = "AI"

[vars]
AI_BACKEND_URL = "https://your-ai-backend.onrender.com"

# Staging environment — also needs AI binding enabled in Cloudflare dashboard
[env.staging]
name = "synapse-backend-staging"

[env.staging.ai]
binding = "AI"

[env.staging.vars]
AI_BACKEND_URL = "https://your-ai-backend.onrender.com"
PREVIEW_MODE = "true"

[observability]
enabled = true
