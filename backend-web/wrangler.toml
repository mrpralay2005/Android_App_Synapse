name = "synapse-backend"
main = "server.js"
compatibility_date = "2025-01-01"
compatibility_flags = [ "nodejs_compat" ]

# Hyperdrive setup for accelerated DB queries
# (Optional) To accelerate, run: wrangler hyperdrive create synapse-db --connection-string="..."
# Then add the [[hyperdrive]] block here with the provided ID.

[vars]
# DATABASE_URL = "Use secrets for this instead (wrangler secret put DATABASE_URL)"
AI_BACKEND_URL = "https://your-ai-backend.onrender.com"

# Supabase Storage is handled via S3-Compatible API in code, no wrangler binding needed.

# Local development environment
[env.dev.vars]
JWT_SECRET = "synapse_x_quantum_secure_2027"
AI_BACKEND_URL = "https://your-ai-backend.onrender.com"

# Isolated release-preview Worker. Its DATABASE_URL and JWT_SECRET must be
# configured as Cloudflare secrets and must point to a Neon staging branch.
[env.staging.vars]
AI_BACKEND_URL = "https://your-ai-backend.onrender.com"

[observability]
enabled = true
