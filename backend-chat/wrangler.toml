name = "synapse-chat"
main = "server.js"
compatibility_date = "2025-01-01"
compatibility_flags = [ "nodejs_compat" ]

# DATABASE_URL = chat database (Turso)
# WEB_DATABASE_URL = web database (Turso) - for User queries
# TURSO_AUTH_TOKEN = auth token for chat database
# WEB_TURSO_AUTH_TOKEN = auth token for web database
# JWT_SECRET = same value used by synapse-backend for token verification
[secrets]
required = [ "DATABASE_URL", "TURSO_AUTH_TOKEN", "WEB_DATABASE_URL", "WEB_TURSO_AUTH_TOKEN", "JWT_SECRET" ]

# Keep Neon DB warm — runs every 4 minutes to prevent auto-suspend.
[triggers]
crons = ["*/4 * * * *"]

[env.staging]
name = "synapse-chat-staging"

[env.staging.secrets]
required = [ "DATABASE_URL", "TURSO_AUTH_TOKEN", "WEB_DATABASE_URL", "WEB_TURSO_AUTH_TOKEN", "JWT_SECRET" ]

[observability]
enabled = true
