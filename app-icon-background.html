<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus App Icon Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .container {
            text-align: center;
        }

        /* Square icon - 512x512 (screenshot this!) */
        .icon-square {
            width: 512px;
            height: 512px;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(100, 60, 200, 0.025) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(80, 50, 180, 0.02) 0%, transparent 60%),
                linear-gradient(135deg, #030207 0%, #020105 40%, #010103 80%, #000000 100%);
            border-radius: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        /* Round icon preview */
        .icon-round {
            width: 512px;
            height: 512px;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(100, 60, 200, 0.025) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(80, 50, 180, 0.02) 0%, transparent 60%),
                linear-gradient(135deg, #030207 0%, #020105 40%, #010103 80%, #000000 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .icon-square img,
        .icon-round img {
            width: 80%;
            height: auto;
            object-fit: contain;
            z-index: 10;
            filter: drop-shadow(0 10px 30px rgba(139, 92, 246, 0.3));
            image-rendering: high-quality;
            image-rendering: -webkit-optimize-contrast;
        }

        .label {
            color: #fff;
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.7;
        }

        h1 {
            color: #a855f7;
            margin-bottom: 40px;
            font-size: 24px;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            max-width: 1200px;
        }

        /* Glow effect */
        .icon-square::before,
        .icon-round::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(100, 50, 200, 0.04), transparent 75%);
            border-radius: inherit;
        }


    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Nexus App Icon Background Preview</h1>
        
        <div class="grid">
            <div>
                <div class="icon-square">
                    <img src="nexus_cleaned.png" alt="Nexus N">
                </div>
                <div class="label">Square Icon (512x512)</div>
                <div class="label">Screenshot this for app icon</div>
            </div>
            
            <div>
                <div class="icon-round">
                    <img src="nexus_cleaned.png" alt="Nexus N">
                </div>
                <div class="label">Round Icon (512x512)</div>
                <div class="label">Screenshot this for round icon</div>
            </div>
        </div>

        <p style="color: #666; margin-top: 40px; font-size: 12px;">
            Very Dark Background with Subtle Purple/Blue Glow (Netflix-style Premium)
        </p>
    </div>
</body>
</html>
