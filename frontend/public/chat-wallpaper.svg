<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="400" height="700">
  <defs>
    <!-- Deep space background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>
    <!-- Central nebula glow -->
    <radialGradient id="nebula1" cx="50%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="30%" stop-color="#cccccc" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#888888" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Bright core -->
    <radialGradient id="core" cx="50%" cy="48%" r="10%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#dddddd" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Nebula wisps -->
    <radialGradient id="wisp1" cx="40%" cy="55%" r="30%">
      <stop offset="0%" stop-color="#aaaaaa" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wisp2" cx="62%" cy="42%" r="25%">
      <stop offset="0%" stop-color="#bbbbbb" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wisp3" cx="35%" cy="38%" r="20%">
      <stop offset="0%" stop-color="#999999" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wisp4" cx="65%" cy="60%" r="22%">
      <stop offset="0%" stop-color="#aaaaaa" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="700" fill="url(#bg)"/>

  <!-- Nebula cloud layers — blurred for soft glow effect -->
  <ellipse cx="200" cy="335" rx="180" ry="140" fill="url(#nebula1)" filter="url(#blur1)"/>
  <ellipse cx="160" cy="385" rx="130" ry="90" fill="url(#wisp1)" filter="url(#blur1)"/>
  <ellipse cx="248" cy="294" rx="100" ry="80" fill="url(#wisp2)" filter="url(#blur1)"/>
  <ellipse cx="140" cy="265" rx="80" ry="60" fill="url(#wisp3)" filter="url(#blur2)"/>
  <ellipse cx="260" cy="420" rx="90" ry="70" fill="url(#wisp4)" filter="url(#blur2)"/>

  <!-- Brighter inner core -->
  <ellipse cx="200" cy="336" rx="60" ry="50" fill="url(#core)" filter="url(#blur2)"/>

  <!-- Bright center star/core point -->
  <circle cx="200" cy="334" r="3" fill="#ffffff" opacity="0.9" filter="url(#blur3)"/>
  <circle cx="200" cy="334" r="1.2" fill="#ffffff" opacity="1"/>

  <!-- Stars — large bright ones -->
  <circle cx="48"  cy="32"  r="1.5" fill="#fff" opacity="0.95"/>
  <circle cx="320" cy="18"  r="1.3" fill="#fff" opacity="0.9"/>
  <circle cx="370" cy="88"  r="1.6" fill="#fff" opacity="0.85"/>
  <circle cx="22"  cy="145" r="1.4" fill="#fff" opacity="0.9"/>
  <circle cx="385" cy="220" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="60"  cy="310" r="1.3" fill="#fff" opacity="0.85"/>
  <circle cx="350" cy="410" r="1.6" fill="#fff" opacity="0.9"/>
  <circle cx="30"  cy="500" r="1.4" fill="#fff" opacity="0.8"/>
  <circle cx="380" cy="560" r="1.5" fill="#fff" opacity="0.85"/>
  <circle cx="100" cy="650" r="1.3" fill="#fff" opacity="0.9"/>
  <circle cx="290" cy="680" r="1.6" fill="#fff" opacity="0.8"/>
  <circle cx="155" cy="58"  r="1.2" fill="#fff" opacity="0.85"/>
  <circle cx="260" cy="75"  r="1.4" fill="#fff" opacity="0.9"/>
  <circle cx="340" cy="290" r="1.3" fill="#fff" opacity="0.8"/>
  <circle cx="75"  cy="450" r="1.5" fill="#fff" opacity="0.9"/>

  <!-- Stars — medium -->
  <circle cx="90"  cy="20"  r="0.9" fill="#fff" opacity="0.8"/>
  <circle cx="200" cy="45"  r="0.8" fill="#fff" opacity="0.7"/>
  <circle cx="340" cy="55"  r="1.0" fill="#fff" opacity="0.75"/>
  <circle cx="10"  cy="80"  r="0.9" fill="#fff" opacity="0.8"/>
  <circle cx="280" cy="110" r="0.8" fill="#fff" opacity="0.7"/>
  <circle cx="130" cy="130" r="1.0" fill="#fff" opacity="0.65"/>
  <circle cx="395" cy="160" r="0.9" fill="#fff" opacity="0.75"/>
  <circle cx="55"  cy="195" r="0.8" fill="#fff" opacity="0.7"/>
  <circle cx="310" cy="180" r="1.0" fill="#fff" opacity="0.65"/>
  <circle cx="170" cy="210" r="0.9" fill="#fff" opacity="0.8"/>
  <circle cx="390" cy="300" r="0.8" fill="#fff" opacity="0.7"/>
  <circle cx="20"  cy="360" r="1.0" fill="#fff" opacity="0.75"/>
  <circle cx="360" cy="355" r="0.9" fill="#fff" opacity="0.7"/>
  <circle cx="115" cy="400" r="0.8" fill="#fff" opacity="0.65"/>
  <circle cx="305" cy="460" r="1.0" fill="#fff" opacity="0.8"/>
  <circle cx="50"  cy="540" r="0.9" fill="#fff" opacity="0.7"/>
  <circle cx="395" cy="490" r="0.8" fill="#fff" opacity="0.75"/>
  <circle cx="220" cy="580" r="1.0" fill="#fff" opacity="0.65"/>
  <circle cx="145" cy="620" r="0.9" fill="#fff" opacity="0.8"/>
  <circle cx="370" cy="640" r="0.8" fill="#fff" opacity="0.7"/>
  <circle cx="80"  cy="690" r="1.0" fill="#fff" opacity="0.75"/>
  <circle cx="240" cy="120" r="0.9" fill="#fff" opacity="0.7"/>
  <circle cx="185" cy="160" r="0.8" fill="#fff" opacity="0.65"/>
  <circle cx="330" cy="140" r="1.0" fill="#fff" opacity="0.8"/>

  <!-- Stars — small/dim -->
  <circle cx="70"  cy="55"  r="0.5" fill="#fff" opacity="0.6"/>
  <circle cx="180" cy="28"  r="0.5" fill="#fff" opacity="0.55"/>
  <circle cx="305" cy="38"  r="0.6" fill="#fff" opacity="0.5"/>
  <circle cx="360" cy="120" r="0.5" fill="#fff" opacity="0.6"/>
  <circle cx="40"  cy="170" r="0.5" fill="#fff" opacity="0.5"/>
