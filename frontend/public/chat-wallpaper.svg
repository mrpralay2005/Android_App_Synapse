  <!-- A few glowing star halos for realism -->
  <circle cx="48"  cy="32"  r="4" fill="#ffffff" opacity="0.06" filter="url(#blur3)"/>
  <circle cx="370" cy="88"  r="3" fill="#ffffff" opacity="0.07" filter="url(#blur3)"/>
  <circle cx="350" cy="410" r="4" fill="#ffffff" opacity="0.06" filter="url(#blur3)"/>
  <circle cx="100" cy="650" r="3" fill="#ffffff" opacity="0.07" filter="url(#blur3)"/>
</svg>
