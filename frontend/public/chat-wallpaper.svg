  <circle cx="375" cy="330" r="0.5" fill="#fff" opacity="0.6"/>
  <circle cx="15"  cy="420" r="0.5" fill="#fff" opacity="0.5"/>
  <circle cx="240" cy="390" r="0.6" fill="#fff" opacity="0.55"/>
  <circle cx="330" cy="500" r="0.5" fill="#fff" opacity="0.6"/>
  <circle cx="170" cy="480" r="0.5" fill="#fff" opacity="0.5"/>
  <circle cx="90"  cy="580" r="0.6" fill="#fff" opacity="0.55"/>
  <circle cx="310" cy="600" r="0.5" fill="#fff" opacity="0.6"/>
  <circle cx="200" cy="640" r="0.5" fill="#fff" opacity="0.5"/>
  <circle cx="55"  cy="670" r="0.6" fill="#fff" opacity="0.55"/>
  <circle cx="340" cy="720" r="0.5" fill="#fff" opacity="0.6"/>
  <circle cx="130" cy="355" r="0.5" fill="#fff" opacity="0.5"/>
  <circle cx="265" cy="320" r="0.6" fill="#fff" opacity="0.55"/>
  <circle cx="195" cy="90"  r="0.5" fill="#fff" opacity="0.6"/>
  <circle cx="115" cy="100" r="0.5" fill="#fff" opacity="0.5"/>
  <circle cx="355" cy="195" r="0.6" fill="#fff" opacity="0.55"/>
  <circle cx="25"  cy="255" r="0.5" fill="#fff" opacity="0.6"/>
  <circle cx="410" cy="440" r="0.5" fill="#fff" opacity="0.5"/>
